<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <meta name="description" content="Slashcmd — open-source skills that make coding agents actually useful." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Slashcmd — Skills for coding agents</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("slashcmd-theme");
        const theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#f5f3ee" : "#11110f";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
